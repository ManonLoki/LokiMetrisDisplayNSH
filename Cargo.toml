[package]
name = "nsh-app-loki-metris-mobile-display"
version = "0.1.0"
edition = "2024"
publish = false
autoexamples = false

[lib]
crate-type = ["rlib"]

[dependencies]
nsh-core = "0.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reuse the ICU version already locked by NSH/URL for the existing NFC rules.
icu_normalizer = "=2.4.0"

# One NSH-owned connection runtime for pairing, sessions, discovery and credentials.
loki_metris_pairing = { git = "https://github.com/ManonLoki/LokiMetis.git", rev = "28b73e602060d750197b2b7384bdb8f3e30f107f" }
base64 = "0.23.1"
uuid = { version = "1.28.0", features = ["v4"] }
# Reuse the encoder version already locked by NSH for application-owned GIF frames.
png = "=0.17.16"

[target.'cfg(not(target_os = "ios"))'.dependencies]
mdns-sd = { version = "0.21.6", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
jni = "0.21.1"

[target.'cfg(target_os = "ios")'.dependencies]
# Existing locked NSH Apple bindings, now used directly by WatchConnectivity.
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSObject", "NSString", "NSURL", "NSValue", "NSNotification", "NSSet", "NSEnumerator"] }
dispatch2 = "0.3.1"
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std", "UIApplication", "UIResponder", "UIScene", "UISceneDefinitions"] }

[[example]]
name = "protocol_host"
path = "src/tests/fixtures/protocol_host.rs"

[dev-dependencies]
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
